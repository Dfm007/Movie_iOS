name: iosmovie
options:
  bundleIdPrefix: com.iosmovie
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    from: "1.8.0"
  VideoPlayerContainer:
    url: https://github.com/shayanbo/VideoPlayerContainer.git
    from: "1.0.0"
  DanmakuKit:
    url: https://github.com/qyz777/DanmakuKit.git
    from: "1.6.0"
targets:
  iosmovie:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    dependencies:
      - package: CryptoSwift
        product: CryptoSwift
      - package: VideoPlayerContainer
        product: VideoPlayerContainer
      - package: DanmakuKit
        product: DanmakuKit
    sources:
      - path: iosmovie
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosmovie.app
        PRODUCT_NAME: 影视王
        INFOPLIST_FILE: iosmovie/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.2"
        ENABLE_PREVIEWS: NO
