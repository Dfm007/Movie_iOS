name: Build iOS Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('iosmovie.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: List files
        run: ls -la

      - name: Fix pbxproj encoding
        run: |
          sed -i '' 's/\r$//' iosmovie.xcodeproj/project.pbxproj
          sed -i '' '1s/^\xEF\xBB\xBF//' iosmovie.xcodeproj/project.pbxproj
          xxd -l 20 iosmovie.xcodeproj/project.pbxproj

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project iosmovie.xcodeproj \
            -scheme iosmovie \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iosmovie.app Payload/
          zip -r unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-iosmovie-ipa
          path: unsigned.ipa
