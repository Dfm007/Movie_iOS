workflows:
  ios-unsigned:
    name: Movie_iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        SCHEME: "iosmovie"
        APP_NAME: "影视王"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
    scripts:
      - name: Install xcodegen
        script: |
          brew install xcodegen
      - name: Generate xcodeproj
        script: |
          xcodegen generate
      - name: Verify generated project
        script: |
          xxd -l 20 iosmovie.xcodeproj/project.pbxproj
          plutil -lint iosmovie.xcodeproj/project.pbxproj
      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -project iosmovie.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_ENTITLEMENTS=""
      - name: Create unsigned IPA
        script: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/${APP_NAME}.app" Payload/
          zip -r unsigned.ipa Payload
    artifacts:
      - unsigned.ipa